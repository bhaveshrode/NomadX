version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nomadx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strong_postgres_password_2026
      POSTGRES_DB: nomadx_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nomadx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nomadx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomadx-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=production
      - DB_URL=postgresql+asyncpg://postgres:strong_postgres_password_2026@postgres:5432/nomadx_production
      - JWT_SECRET=nomadx-production-secret-key-987654321-ensure-overridden-in-deployment
      - INTERNAL_SECRET=nomadx-production-internal-secret-token-2026
      - BASE_RPC_URL=https://mainnet.base.org
    expose:
      - "8000"
    command: ["api"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nomadx-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nomadx-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=production
      - DB_URL=postgresql+asyncpg://postgres:strong_postgres_password_2026@postgres:5432/nomadx_production
      - JWT_SECRET=nomadx-production-secret-key-987654321-ensure-overridden-in-deployment
      - INTERNAL_SECRET=nomadx-production-internal-secret-token-2026
      - BASE_RPC_URL=https://mainnet.base.org
    command: ["worker"]

  nginx-gateway:
    build:
      context: ./nginx
    container_name: nomadx-nginx-gateway
    depends_on:
      - nomadx-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

volumes:
  postgres_data:
